{% extends 'builder/base.html' %}
{% block title %}Change password{% endblock %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="form narrow">{% csrf_token %}
  {% for field in form %}
    <label>{{ field.label }} {{ field }}{% if field.errors %}<span class="error">{{ field.errors|join:' ' }}</span>{% endif %}</label>
  {% endfor %}
  <div class="form-actions"><button class="btn primary" type="submit">Change password</button></div>
</form>
{% endblock %}
